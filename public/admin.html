<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Заявки</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell wide">
      <section class="panel">
        <div class="toolbar">
          <div>
            <p class="eyebrow">Администратор</p>
            <h1>Заявки с сайта</h1>
          </div>
          <button id="refresh" type="button">Обновить</button>
        </div>
        <p id="admin-status" class="status" role="status">Загрузка заявок...</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                <th>Имя</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Сообщение</th>
              </tr>
            </thead>
            <tbody id="applications"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
